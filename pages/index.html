<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css"
    />

    <link rel="stylesheet" href="/styles/main.css">

    <title>Expense Tracker</title>
</head>

<body class="bg-light">

<div class="container mt-5">

    <!-- Başlık -->
    <div class="text-center mb-4">
        <h2 class="font-weight-bold text-dark">Expense Tracker</h2>
        <p class="text-muted">Gelir ve giderlerini yönet</p>
    </div>

    <!-- Input Alanı -->
    <div class="card shadow-sm p-3 mb-4">
        <div class="input-group">
            <input type="text" id="money" class="form-control" placeholder="Miktarı Giriniz ...">
            <div class="input-group-append">
                <button class="btn btn-success" onclick="addPrice()">EKLE</button>
            </div>
        </div>
    </div>

    <!-- Liste -->
    <div class="card shadow-sm p-3">
        <ul id="priceList" class="list-group"></ul>
    </div>

</div>

<script src="/js/main3.js"></script>
</body>
</html>
